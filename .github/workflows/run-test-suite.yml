name: Run the test suite

on:
  pull_request:
  push:
  schedule:
    - cron: '0 16 * * 5'  # Every Friday 4pm
  workflow_dispatch:

jobs:
  install_and_run:
    name: Run the test suite
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.11, 3.15]  # no need for anything in between
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |-
          python3 -m venv venv/
          source venv/bin/activate
          pip3 install \
            --disable-pip-version-check \
            --no-warn-script-location \
            -r requirements.txt
          pip3 check
          # Ensure that even indirect dependencies are fully pinned
          diff -u0 \
            <(sed -e '/^#/d' -e '/^$/d' requirements.txt | sort -f) \
            <(pip3 freeze | sort -f)

      - name: Run the test suite
        run: |-
          source venv/bin/activate
          coverage run -m pytest -v --doctest-modules
          coverage report --show-missing | tee coverage.txt
          coverage html

      - name: Upload HTML coverage report as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: "coverage_python_${{ matrix.python-version }}"  # .zip
          path: |
            coverage.txt
            htmlcov/
          if-no-files-found: error
